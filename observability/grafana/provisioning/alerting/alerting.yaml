apiVersion: 1

contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: responder-webhook
        type: webhook
        settings:
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST

policies:
  - orgId: 1
    receiver: incident-responder
    group_by: ["alertname"]
    group_wait: 0s
    group_interval: 1m
    repeat_interval: 1h

groups:
  - orgId: 1
    name: order-tracker
    folder: Order Tracker
    interval: 10s
    rules:
      - uid: order-tracker-5xx
        title: OrderTracker5xx
        condition: C
        for: 0s
        noDataState: OK          # no 5xx series at all => healthy (Normal), not "No data"
        execErrState: Error
        labels:
          severity: critical
          service: order-tracker
        annotations:
          summary: "5xx responses on GET /api/orders/{order_id}"
          endpoint: "GET /api/orders/{order_id}"
          window: "last 5 minutes"
          dashboard: "http://localhost:3000/d/order-tracker/order-tracker-overview"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # "or vector(0)" => zero errors evaluates to 0 instead of an empty result
              expr: 'sum(increase(http_server_duration_milliseconds_count{http_status_code=~"5.."}[5m])) or vector(0)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
